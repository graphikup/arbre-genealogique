<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arbre généalogique</title>
<meta name="theme-color" content="#121a28">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  :root{--bg:#121a28;--card:#1b2536;--bd:#2c3a52;--ink:#eef1f6;--muted:#93a0b5;--gold:#c9a25a}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:radial-gradient(circle at 50% 35%,#1f2b3f 0%,var(--bg) 70%);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 22px calc(32px + env(safe-area-inset-bottom))}
  img{width:132px;height:132px;border-radius:28px;box-shadow:0 14px 40px rgba(201,162,90,.18)}
  h1{font-size:26px;letter-spacing:-.02em;margin:22px 0 4px}
  p.s{color:var(--muted);margin:0 0 26px;font-size:14px}
  form{width:min(340px,100%);display:flex;flex-direction:column;gap:12px}
  input{width:100%;padding:14px 16px;border-radius:14px;border:1px solid var(--bd);background:var(--card);color:var(--ink);font-size:17px;outline:none;text-align:center;letter-spacing:.08em}
  input:focus{border-color:var(--gold)}
  button{padding:14px;border-radius:14px;border:0;background:var(--gold);color:#1a1408;font-weight:700;font-size:16px;cursor:pointer}
  button:disabled{opacity:.6}
  .err{color:#e59a8f;font-size:14px;text-align:center;min-height:20px;margin:0}
  label{display:flex;gap:8px;align-items:center;justify-content:center;color:var(--muted);font-size:13px}
  label input{width:auto}
</style>
</head>
<body>
<main>
  <img src="icons/icon-512.png" alt="">
  <h1>Arbre généalogique</h1>
  <p class="s">Accès privé</p>
  <form id="f" autocomplete="off">
    <input id="pw" type="password" inputmode="text" placeholder="Mot de passe" autofocus required>
    <button id="go" type="submit">Ouvrir</button>
    <p class="err" id="err"></p>
  </form>
</main>
<script>
const $ = id => document.getElementById(id);
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
function idb(){ return new Promise((res,rej)=>{ const r=indexedDB.open('arbre-vault',1); r.onupgradeneeded=()=>r.result.createObjectStore('k'); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
async function idbGet(k){ const db=await idb(); return new Promise((res,rej)=>{ const t=db.transaction('k').objectStore('k').get(k); t.onsuccess=()=>res(t.result||null); t.onerror=()=>rej(t.error); }); }
async function idbPut(k,v){ const db=await idb(); return new Promise((res,rej)=>{ const t=db.transaction('k','readwrite'); t.objectStore('k').put(v,k); t.oncomplete=()=>res(); t.onerror=()=>rej(t.error); }); }
async function idbDel(k){ const db=await idb(); return new Promise(res=>{ const t=db.transaction('k','readwrite'); t.objectStore('k').delete(k); t.oncomplete=()=>res(); }); }

async function swReady(){
  if(!('serviceWorker' in navigator)) throw new Error('nosw');
  await navigator.serviceWorker.register('sw.js');
  await navigator.serviceWorker.ready;
}
function openApp(){ location.replace('app.html'); }

(async()=>{
  try{ await swReady(); }catch(e){ $('err').textContent="Ce navigateur ne permet pas d'ouvrir l'arbre (service worker indisponible)."; $('go').disabled=true; return; }
  if(new URLSearchParams(location.search).get('e')){ $('err').innerHTML="L'arbre n'a pas pu s'ouvrir (connexion ?). <a href='app.html' style='color:#c9a25a'>Réessayer</a> ou entre à nouveau le mot de passe."; return; }
  if(await idbGet('priv')) openApp();
})();

$('f').onsubmit = async ev => {
  ev.preventDefault(); $('err').textContent=''; $('go').disabled=true; $('go').textContent='Ouverture…';
  try{
    const L = await (await fetch('vault/lock.json',{cache:'no-store'})).json();
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode($('pw').value), 'PBKDF2', false, ['deriveKey']);
    const kek = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(L.salt), iterations:L.iter, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['decrypt']);
    let pkcs8;
    try{ pkcs8 = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(L.iv)}, kek, b64(L.data)); }
    catch(e){ throw new Error('pw'); }
    const key = await crypto.subtle.importKey('pkcs8', pkcs8, {name:'RSA-OAEP', hash:'SHA-256'}, false, ['decrypt']);
    await idbPut('priv', key);
    openApp();
  }catch(e){
    $('err').textContent = e.message==='pw' ? 'Mot de passe incorrect.' : "Impossible d'ouvrir l'arbre pour le moment (connexion ?).";
    $('go').disabled=false; $('go').textContent='Ouvrir';
  }
};
</script>
</body>
</html>
